name: openai-auth-validate

on:
  push:
    paths:
      - '.github/workflows/openai-auth-validate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  platform-key:
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - name: Validate Platform API key without exposing it
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${OPENAI_API_KEY:-}" ]; then
            echo 'OPENAI_API_KEY secret is not installed in this repository.'
            exit 0
          fi
          code="$(curl -sS --connect-timeout 10 --max-time 30 -o /tmp/platform.json -w '%{http_code}' \
            -H "Authorization: Bearer ${OPENAI_API_KEY}" \
            https://api.openai.com/v1/models || true)"
          echo "Platform API HTTP ${code}"
          if [ "${code}" != "200" ]; then
            echo 'Platform authentication failed.'
            exit 1
          fi
          python3 - <<'PY'
import json
with open('/tmp/platform.json', 'r', encoding='utf-8') as f:
    data=json.load(f)
models=data.get('data', [])
print('Platform authentication OK; models visible:', len(models))
PY

  chatgpt-admin-key:
    runs-on: ubuntu-latest
    env:
      CHATGPT_ADMIN_API_KEY: ${{ secrets.CHATGPT_ADMIN_API_KEY }}
      CHATGPT_WORKSPACE_ID: ${{ vars.CHATGPT_WORKSPACE_ID }}
    steps:
      - name: Validate ChatGPT workspace Admin key without exposing it
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${CHATGPT_ADMIN_API_KEY:-}" ]; then
            echo 'CHATGPT_ADMIN_API_KEY secret is not installed in this repository.'
            exit 0
          fi
          if [ -z "${CHATGPT_WORKSPACE_ID:-}" ]; then
            echo 'CHATGPT_WORKSPACE_ID repository variable is not configured.'
            exit 0
          fi
          url="https://api.chatgpt.com/v1/manage/workspaces/${CHATGPT_WORKSPACE_ID}/users?limit=1"
          code="$(curl -sS --connect-timeout 10 --max-time 30 -o /tmp/admin.json -w '%{http_code}' \
            -H "Authorization: Bearer ${CHATGPT_ADMIN_API_KEY}" \
            "${url}" || true)"
          echo "ChatGPT Admin API HTTP ${code}"
          if [ "${code}" != "200" ]; then
            echo 'Workspace Admin authentication/scope/workspace validation failed.'
            exit 1
          fi
          echo 'ChatGPT workspace Admin authentication OK.'
